[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sopralluogo"
version = "0.1.0"
description = "Ricostruzione 3D misurabile di scene riprese da video (camera fissa, multi-camera)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
  "scipy>=1.10",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]

[project.scripts]
sopralluogo = "sopralluogo.cli:main"

[tool.setuptools.packages.find]
include = ["sopralluogo*"]
